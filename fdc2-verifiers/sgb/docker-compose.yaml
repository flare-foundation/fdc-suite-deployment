name: fdc2-verifier-sgb

x-verifier: &verifier
  image: ghcr.io/flare-foundation/go-verifier-api:v0.0.2@sha256:033a61a2f2965805089a91d106a52d8583acefa1597aa4a183e033f5d2df9c72
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3120/api/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

volumes:
  c-chain-indexer-database:

services:
  c-chain-indexer-db:
    image: mysql:9.5.0@sha256:57c892ddeb17e6c7dddf219914db017b2cf3e2797806a75424444b83622cc8ef
    profiles: [c-chain-indexer]
    env_file:
      - c-chain-indexer/database.env
    restart: unless-stopped
    volumes:
      - c-chain-indexer-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent --host localhost -p$${MYSQL_ROOT_PASSWORD}"]
      start_period: 60s
      start_interval: 2s
      timeout: 20s
      retries: 10

  c-chain-indexer:
    image: ghcr.io/flare-foundation/flare-system-c-chain-indexer:v1.1.3@sha256:262778a5ca4bb8b6a6c297ea118c3d87fdf640757b316c5cebe8f41be6466dd9
    profiles: [c-chain-indexer]
    env_file:
      - c-chain-indexer/indexer.env
    restart: unless-stopped
    volumes:
      - ./c-chain-indexer/config.toml:/app/config.toml:ro
    depends_on:
      c-chain-indexer-db:
        condition: service_healthy

  verifier_tee_availability:
    <<: *verifier
    environment:
      VERIFIER_TYPE: TeeAvailabilityCheck
      SOURCE_ID: TEE
    env_file:
      - verifier.env
      - tee.env
    ports:
      - "9901:3120"

  verifier_pmw_multisig:
    <<: *verifier
    environment:
      VERIFIER_TYPE: PMWMultisigAccountConfigured
    env_file:
      - verifier.env
      - pmw-multisig.env
    ports:
      - "9902:3120"

  verifier_pmw_payment_status:
    <<: *verifier
    environment:
      VERIFIER_TYPE: PMWPaymentStatus
    env_file:
      - verifier.env
      - pmw-indexed.env
    ports:
      - "9903:3120"

  verifier_pmw_fee_proof:
    <<: *verifier
    environment:
      VERIFIER_TYPE: PMWFeeProof
    env_file:
      - verifier.env
      - pmw-indexed.env
    ports:
      - "9904:3120"
