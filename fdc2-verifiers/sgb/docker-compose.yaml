name: fdc2-verifier-sgb

x-verifier-healthcheck: &verifier-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

x-verifier: &verifier
  image: ghcr.io/flare-foundation/go-verifier-api:v0.2.3@sha256:5edbcfb463610116fcbeb0428cc3289949c4c45dc3dc237ee1b295488edc49e6
  restart: unless-stopped

volumes:
  c-chain-indexer-database:

services:
  c-chain-indexer-db:
    image: mysql:9.5.0@sha256:57c892ddeb17e6c7dddf219914db017b2cf3e2797806a75424444b83622cc8ef
    profiles: [c-chain-indexer]
    env_file:
      - c-chain-indexer/database.env
    restart: unless-stopped
    volumes:
      - c-chain-indexer-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent --host localhost -p$${MYSQL_ROOT_PASSWORD}"]
      start_period: 60s
      start_interval: 2s
      timeout: 20s
      retries: 10

  c-chain-indexer:
    image: ghcr.io/flare-foundation/flare-system-c-chain-indexer:v2.1.0@sha256:c5f2e15b03c74bfe4d6c6c5c89a082655f6ae8b8e4fa7381029c2d48ad8bcdee
    profiles: [c-chain-indexer]
    env_file:
      - c-chain-indexer/indexer.env
    restart: unless-stopped
    volumes:
      - ./c-chain-indexer/config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2h
    depends_on:
      c-chain-indexer-db:
        condition: service_healthy

  verifier_tee:
    <<: *verifier
    environment:
      SOURCE_ID: TEE
    env_file:
      - verifier.env
      - tee.env
    healthcheck:
      <<: *verifier-healthcheck
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3120/verifier/tee/$${DESTINATION_CHAIN_URL_SLUG}/api/health"]
    ports:
      - "9901:3120"

  verifier_xrp:
    <<: *verifier
    env_file:
      - verifier.env
      - xrp.env
    healthcheck:
      <<: *verifier-healthcheck
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3120/verifier/xrp/$${DESTINATION_CHAIN_URL_SLUG}/api/health"]
    ports:
      - "9902:3120"
