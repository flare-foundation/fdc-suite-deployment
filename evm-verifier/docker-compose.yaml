x-verifier: &verifier
  image: ghcr.io/flare-foundation/verifier-indexer-api:v1.7.0@sha256:8b52123fc0e6232ecfbc51ab6011af7edb612fc843024264fc6d898ebd75a4cb
  restart: unless-stopped

services:
  verifier_eth:
    <<: *verifier
    environment:
      VERIFIER_TYPE: eth
      APP_BASE_PATH: /verifier/eth
    env_file:
      - verifier.env
      - verifier-eth.env
    ports:
      - "9701:9700"

  verifier_flr:
    <<: *verifier
    environment:
      VERIFIER_TYPE: flr
      APP_BASE_PATH: /verifier/flr
    env_file:
      - verifier.env
      - verifier-flr.env
    ports:
      - "9702:9700"

  verifier_sgb:
    <<: *verifier
    environment:
      VERIFIER_TYPE: sgb
      APP_BASE_PATH: /verifier/sgb
    env_file:
      - verifier.env
      - verifier-sgb.env
    ports:
      - "9703:9700"
