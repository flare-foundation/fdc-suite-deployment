name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if stable release
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # align with build-docker.yml: stable only for strict semver tags
          if [[ "${REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="${TAG}"
          body=$(sed -n "/^\## .*\[${tag}\]/,/^\## .*\[v/{/^\## .*\[v/!p}" RELEASES.md || true)
          cat >> "$GITHUB_OUTPUT" <<DELIM
          body<<EOF
          ${body}

          **Full Changelog**: https://github.com/${REPOSITORY}/blob/${tag}/RELEASES.md
          EOF
          DELIM

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
          STABLE: ${{ steps.check.outputs.stable }}
        run: |
          if [[ "${STABLE}" == "true" ]]; then
            flags=(--latest)
          else
            flags=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes "${BODY}" "${flags[@]}"
